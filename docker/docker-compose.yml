services:

  # ----------------------------------------------------------------
  # MediaMTX — RTSP / WebRTC / HLS / RTMP streaming server
  # ----------------------------------------------------------------
  mediamtx:
    image: bluenviron/mediamtx:1-ffmpeg-rpi@sha256:186f767f20769e6b2a35b9c99af90ad23da3e8431013255a140fbb66e71b0c1d
    container_name: mediamtx
    restart: ${RESTART_POLICY:-on-failure}
    network_mode: host
    volumes:
      - ../config/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 --timeout=2 http://127.0.0.1:8888/ 2>/dev/null; test $? -ne 4"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ----------------------------------------------------------------
  # coturn — local TURN server for WebRTC ICE relay
  #
  # Optional, but recommended for maximum browser compatibility: Firefox hides
  # its local IP behind an mDNS (.local) name that MediaMTX cannot resolve, so
  # the live stream only connects when relayed through this TURN server.
  # Only disable it if you do not need Firefox support (and possibly other
  # browsers which hides its local IP behind an mDNS). 
  # To disable: remove this service and the coturn entry under
  # depends_on of the camui container, and remove the webrtcICEServers2 section 
  # from ../config/mediamtx/mediamtx.yml
  # ----------------------------------------------------------------
  coturn:
    image: coturn/coturn:alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
    container_name: coturn
    restart: ${RESTART_POLICY:-on-failure}
    network_mode: host
    volumes:
      - ../config/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3478"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s

  # ----------------------------------------------------------------
  # CamUI — Flask app (gunicorn + GeventWebSocketWorker)
  # Requires mediamtx and coturn to be healthy before starting.
  # PulseAudio/PipeWire stays on the host; the socket is mounted in.
  # ----------------------------------------------------------------
  camui:
    container_name: camui
    image: ghcr.io/j-josi/camui-webrtc:latest
    privileged: true
    restart: ${RESTART_POLICY:-on-failure}
    network_mode: host
    depends_on:
      mediamtx:
        condition: service_healthy
      coturn:
        condition: service_healthy
    environment:
      - PULSE_SERVER=unix:/run/user/${PUID:-1000}/pulse/native
      - XDG_RUNTIME_DIR=/run/user/${PUID:-1000}
      - PYTHONUNBUFFERED=1
      - LIBCAMERA_LOG_LEVELS=*:ERROR
    volumes:
      - /run/udev:/run/udev:ro
      - /dev:/dev
      - ../static/gallery:/app/static/gallery
      - /run/user/${PUID:-1000}/pulse:/run/user/${PUID:-1000}/pulse:ro
