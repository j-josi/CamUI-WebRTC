<script src="{{ url_for('static', filename='js/lottie-player.js') }}"></script>

<div id="animatedOverlay" style="position:absolute;display:none;pointer-events:none;">
  <lottie-player
    src="{{ url_for('static', filename='img/shutter_animation.json') }}"
    background="transparent"
    speed="1"
    style="width:100%;height:100%;"
    loop
    autoplay>
  </lottie-player>
</div>

<script>
function showOverlay() {
    const videoFeed = document.getElementById("videoFeed");
    const overlay   = document.getElementById("animatedOverlay");
    const rect = videoFeed.getBoundingClientRect();
    const size = Math.round(rect.height * 0.7);
    overlay.style.width  = `${size}px`;
    overlay.style.height = `${size}px`;
    overlay.style.top  = `${rect.top  + window.scrollY + rect.height / 2 - size / 2}px`;
    overlay.style.left = `${rect.left + window.scrollX + rect.width  / 2 - size / 2}px`;
    videoFeed.style.visibility = "hidden";
    overlay.style.display = "block";
}

function hideOverlay() {
    document.getElementById("animatedOverlay").style.display = "none";
    document.getElementById("videoFeed").style.visibility = "visible";
}
</script>
